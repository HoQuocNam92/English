name: Check Mobile and Build Android APK

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc

defaults:
  tools:
    node: '26.12.0'
    pnpm: '12.8.1'

jobs:
  check_mobile:
    name: Check TypeScript and Mobile Tests
    environment: preview
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Check mobile TypeScript
        run: pnpm --filter mobile typecheck
      - name: Run mobile regression tests
        run: pnpm --filter mobile test

  build_android:
    name: Build Installable Android APK
    needs: [check_mobile]
    type: build
    params:
      platform: android
      profile: preview
