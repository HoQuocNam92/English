// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// Native libraries also need short object paths when building on Windows.
if (System.getProperty('os.name').toLowerCase().contains('windows')) {
  subprojects { nativeProject ->
    nativeProject.plugins.withId('com.android.library') {
      def androidExtension = nativeProject.extensions.getByName('android')
      androidExtension.externalNativeBuild.cmake.buildStagingDirectory = new File(rootProject.projectDir, "../../../artifacts/cxx/${nativeProject.name}")
      androidExtension.defaultConfig.externalNativeBuild.cmake.arguments.add('-DCMAKE_OBJECT_PATH_MAX=240')
      def ninjaPath = rootProject.findProperty('windowsNinjaPath')
      if (ninjaPath) {
        androidExtension.defaultConfig.externalNativeBuild.cmake.arguments.add("-DCMAKE_MAKE_PROGRAM=${ninjaPath.toString().replace('\\', '/')}")
      }
    }
  }
}
