openapi: 3.0.3
info:
  title: TechEnglish Pro API
  version: 1.0.0
  description: |
    REST API contract cho hệ thống TechEnglish Pro (KLCN028).

    ## Quy ước
    - Base path: `/api/v1`.
    - ID sử dụng UUID.
    - Thời gian sử dụng ISO 8601 UTC.
    - Endpoint có biểu tượng khóa yêu cầu JWT Bearer token.
    - Danh sách dùng phân trang theo `page` và `limit`.
    - Client không được gửi điểm khi nộp bài; server là nguồn sự thật cho chấm điểm.

    ## Vai trò
    - `admin`: quản trị tài khoản, danh mục và toàn bộ dữ liệu.
    - `teacher`: quản lý nội dung, câu hỏi, bài thi và xem báo cáo được phép.
    - `learner`: học bài, làm bài thi và xem dữ liệu cá nhân.
  contact:
    name: TechEnglish Pro
  license:
    name: Proprietary - Academic Project
servers:
  - url: /api/v1
    description: Cùng host với API deployment; local mặc định là http://localhost:3080/api/v1.
tags:
  - name: Auth
    description: Đăng ký, đăng nhập và quản lý phiên.
  - name: Users
    description: Quản lý tài khoản và vai trò.
  - name: Learner Profiles
    description: Hồ sơ, sở thích và mục tiêu của học viên.
  - name: Learner Groups
    description: Lớp học, giảng viên phụ trách và danh sách thành viên.
  - name: Domains
    description: Lĩnh vực CNTT.
  - name: Levels
    description: Cấp độ học.
  - name: Career Goals
    description: Mục tiêu nghề nghiệp.
  - name: Certificates
    description: Chứng chỉ và nội dung ôn tập.
  - name: Vocabularies
    description: Từ vựng và thuật ngữ chuyên ngành.
  - name: Lessons
    description: Bài học và nội dung bài học.
  - name: Questions
    description: Ngân hàng câu hỏi.
  - name: Exams
    description: Xây dựng và phát hành bài kiểm tra.
  - name: Attempts
    description: Làm bài, nộp bài và xem kết quả.
  - name: Progress
    description: Tiến độ học tập được tính từ hoạt động thực tế.
  - name: Reports
    description: Dữ liệu tổng hợp cho dashboard và báo cáo.
  - name: Recommendations
    description: Gợi ý học tập cá nhân hóa.

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản học viên
      operationId: registerLearner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Cấp lại access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token mới.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất và thu hồi refresh token
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Đăng xuất thành công.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Lấy phiên người dùng hiện tại
      operationId: getCurrentUser
      responses:
        '200':
          description: Thông tin người dùng hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Đổi mật khẩu
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Đổi mật khẩu thành công; các phiên cũ có thể bị thu hồi.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users:
    get:
      tags: [Users]
      summary: Danh sách tài khoản
      description: Chỉ Admin/Giảng viên có quyền phù hợp.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
      responses:
        '200':
          description: Danh sách tài khoản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Tạo tài khoản
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Tài khoản đã tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Chi tiết tài khoản
      operationId: getUser
      responses:
        '200':
          description: Chi tiết tài khoản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Cập nhật tài khoản
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Tài khoản sau cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: Vô hiệu hóa tài khoản
      description: Không xóa lịch sử học; chuyển trạng thái tài khoản sang inactive.
      operationId: deactivateUser
      responses:
        '204':
          description: Tài khoản đã bị vô hiệu hóa.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /learner-profiles:
    get:
      tags: [Learner Profiles]
      summary: Danh sách hồ sơ học viên
      operationId: listLearnerProfiles
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: levelId
          in: query
          schema:
            type: string
            format: uuid
        - name: domainId
          in: query
          schema:
            type: string
            format: uuid
        - name: certificateId
          in: query
          schema:
            type: string
            format: uuid
        - name: careerGoalId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Danh sách hồ sơ học viên.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerProfileListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /learner-groups:
    get:
      tags: [Learner Groups]
      summary: Danh sách nhóm học viên
      operationId: listLearnerGroups
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DomainFilter'
        - name: certificateId
          in: query
          schema: { type: string, format: uuid }
        - name: teacherId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LearnerGroupStatus' }
      responses:
        '200':
          description: Danh sách nhóm học viên và tiến độ tổng hợp.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearnerGroupListResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Learner Groups]
      summary: Tạo nhóm học viên
      operationId: createLearnerGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearnerGroupWriteRequest' }
      responses:
        '201':
          description: Nhóm học viên đã tạo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearnerGroupResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /learner-groups/{learnerGroupId}:
    parameters:
      - $ref: '#/components/parameters/LearnerGroupId'
    get:
      tags: [Learner Groups]
      summary: Chi tiết nhóm và thành viên
      operationId: getLearnerGroup
      responses:
        '200':
          description: Chi tiết nhóm học viên.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearnerGroupResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Learner Groups]
      summary: Cập nhật nhóm học viên
      operationId: updateLearnerGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearnerGroupWriteRequest' }
      responses:
        '200':
          description: Nhóm sau cập nhật.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearnerGroupResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Learner Groups]
      summary: Lưu trữ nhóm học viên
      operationId: archiveLearnerGroup
      responses:
        '204':
          description: Nhóm học viên đã được lưu trữ.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /learner-groups/{learnerGroupId}/members:
    parameters:
      - $ref: '#/components/parameters/LearnerGroupId'
    put:
      tags: [Learner Groups]
      summary: Thay thế danh sách thành viên nhóm
      description: Idempotent; learnerIds phải thuộc các tài khoản có vai trò learner.
      operationId: replaceLearnerGroupMembers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceGroupMembersRequest' }
      responses:
        '200':
          description: Nhóm cùng danh sách thành viên mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearnerGroupResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /learner-profiles/me:
    get:
      tags: [Learner Profiles]
      summary: Hồ sơ học viên hiện tại
      operationId: getMyLearnerProfile
      responses:
        '200':
          description: Hồ sơ hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Learner Profiles]
      summary: Tạo hoặc cập nhật hồ sơ hiện tại
      operationId: upsertMyLearnerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertLearnerProfileRequest'
      responses:
        '200':
          description: Hồ sơ sau cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerProfileResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /learner-profiles/{learnerProfileId}:
    parameters:
      - $ref: '#/components/parameters/LearnerProfileId'
    get:
      tags: [Learner Profiles]
      summary: Chi tiết hồ sơ học viên
      operationId: getLearnerProfile
      responses:
        '200':
          description: Chi tiết hồ sơ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerProfileResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Learner Profiles]
      summary: Cập nhật hồ sơ học viên
      operationId: updateLearnerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertLearnerProfileRequest'
      responses:
        '200':
          description: Hồ sơ sau cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerProfileResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /domains:
    get:
      tags: [Domains]
      summary: Danh sách lĩnh vực CNTT
      operationId: listDomains
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/ActiveOnly'
      responses:
        '200':
          description: Danh sách lĩnh vực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Domains]
      summary: Tạo lĩnh vực CNTT
      operationId: createDomain
      requestBody:
        $ref: '#/components/requestBodies/DomainWriteBody'
      responses:
        '201':
          description: Lĩnh vực đã tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /domains/{domainId}:
    parameters:
      - $ref: '#/components/parameters/DomainId'
    get:
      tags: [Domains]
      summary: Chi tiết lĩnh vực CNTT
      operationId: getDomain
      security: []
      responses:
        '200':
          description: Chi tiết lĩnh vực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Domains]
      summary: Cập nhật lĩnh vực CNTT
      operationId: updateDomain
      requestBody:
        $ref: '#/components/requestBodies/DomainWriteBody'
      responses:
        '200':
          description: Lĩnh vực sau cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Domains]
      summary: Ngừng sử dụng lĩnh vực CNTT
      operationId: archiveDomain
      responses:
        '204':
          description: Lĩnh vực đã được lưu trữ.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /levels:
    get:
      tags: [Levels]
      summary: Danh sách cấp độ học
      operationId: listLevels
      security: []
      responses:
        '200':
          description: Danh sách cấp độ theo thứ tự tăng dần.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Levels]
      summary: Tạo cấp độ học
      operationId: createLevel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LevelWriteRequest'
      responses:
        '201':
          description: Cấp độ đã tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /levels/{levelId}:
    parameters:
      - $ref: '#/components/parameters/LevelId'
    get:
      tags: [Levels]
      summary: Chi tiết cấp độ học
      operationId: getLevel
      security: []
      responses:
        '200':
          description: Chi tiết cấp độ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Levels]
      summary: Cập nhật cấp độ học
      operationId: updateLevel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LevelWriteRequest'
      responses:
        '200':
          description: Cấp độ sau cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Levels]
      summary: Ngừng sử dụng cấp độ học
      operationId: archiveLevel
      responses:
        '204':
          description: Cấp độ đã được lưu trữ.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /career-goals:
    get:
      tags: [Career Goals]
      summary: Danh sách mục tiêu nghề nghiệp
      operationId: listCareerGoals
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/ActiveOnly'
      responses:
        '200':
          description: Danh sách mục tiêu nghề nghiệp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerGoalListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Career Goals]
      summary: Tạo mục tiêu nghề nghiệp
      operationId: createCareerGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareerGoalWriteRequest'
      responses:
        '201':
          description: Mục tiêu nghề nghiệp đã tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerGoalResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /career-goals/{careerGoalId}:
    parameters:
      - $ref: '#/components/parameters/CareerGoalId'
    get:
      tags: [Career Goals]
      summary: Chi tiết mục tiêu nghề nghiệp
      operationId: getCareerGoal
      security: []
      responses:
        '200':
          description: Chi tiết mục tiêu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerGoalResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Career Goals]
      summary: Cập nhật mục tiêu nghề nghiệp
      operationId: updateCareerGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareerGoalWriteRequest'
      responses:
        '200':
          description: Mục tiêu sau cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerGoalResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Career Goals]
      summary: Ngừng sử dụng mục tiêu nghề nghiệp
      operationId: archiveCareerGoal
      responses:
        '204':
          description: Mục tiêu đã được lưu trữ.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /certificates:
    get:
      tags: [Certificates]
