      summary: Báo cáo tiến độ học tập
      operationId: getLearningProgressReport
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DomainFilter'
        - $ref: '#/components/parameters/LevelFilter'
      responses:
        '200':
          description: Báo cáo tiến độ theo học viên.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningProgressReportResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /recommendations/me:
    get:
      tags: [Recommendations]
      summary: Gợi ý học tập cá nhân hóa
      operationId: getMyRecommendations
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        '200':
          description: Danh sách gợi ý theo ưu tiên cùng lý do giải thích.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /recommendations/{recommendationId}/feedback:
    parameters:
      - $ref: '#/components/parameters/RecommendationId'
    post:
      tags: [Recommendations]
      summary: Gửi phản hồi cho gợi ý
      operationId: submitRecommendationFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationFeedbackRequest'
      responses:
        '204':
          description: Đã ghi nhận phản hồi.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      description: Số trang, bắt đầu từ 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Số phần tử mỗi trang.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      description: Tìm kiếm không phân biệt hoa thường theo các trường văn bản chính.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    Sort:
      name: sort
      in: query
      description: Trường và chiều sắp xếp, ví dụ `createdAt:desc`.
      schema:
        type: string
        pattern: '^[A-Za-z][A-Za-z0-9]*:(asc|desc)$'
        example: createdAt:desc
    ActiveOnly:
      name: activeOnly
      in: query
      schema:
        type: boolean
        default: true
    FromDate:
      name: from
      in: query
      description: Thời điểm bắt đầu, bao gồm giá trị này.
      schema:
        type: string
        format: date-time
    ToDate:
      name: to
      in: query
      description: Thời điểm kết thúc, bao gồm giá trị này.
      schema:
        type: string
        format: date-time
    DomainFilter:
      name: domainId
      in: query
      schema:
        type: string
        format: uuid
    LevelFilter:
      name: levelId
      in: query
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LearnerId:
      name: learnerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LearnerProfileId:
      name: learnerProfileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LearnerGroupId:
      name: learnerGroupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DomainId:
      name: domainId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LevelId:
      name: levelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CareerGoalId:
      name: careerGoalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CertificateId:
      name: certificateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VocabularyId:
      name: vocabularyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LessonId:
      name: lessonId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExamId:
      name: examId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      schema: { type: string, format: uuid }

  requestBodies:
    DomainWriteBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainWriteRequest'

  responses:
    Unauthorized:
      description: Token thiếu, hết hạn hoặc không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: { code: UNAUTHORIZED, message: Authentication is required., requestId: req_01 }
    Forbidden:
      description: Người dùng không có quyền thực hiện thao tác.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Dữ liệu đầu vào không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:
    UserRole:
      type: string
      description: Vai trò quyết định phạm vi truy cập.
      enum: [admin, teacher, learner]
    UserStatus:
      type: string
      enum: [active, inactive, suspended]
    ContentStatus:
      type: string
      enum: [draft, published, archived]
    LessonType:
      type: string
      enum: [vocabulary, terminology, technical_reading, api_documentation, system_design, case_study]
    QuestionType:
      type: string
      enum: [single_choice, multiple_choice, true_false, short_answer, scenario]
    AttemptStatus:
      type: string
      enum: [in_progress, submitted, graded, expired]
    ProgressStatus:
      type: string
      enum: [not_started, in_progress, completed]
    LearnerGroupStatus:
      type: string
      enum: [active, completed, archived]

    PaginationMeta:
      type: object
      required: [page, limit, totalItems, totalPages, hasNextPage, hasPreviousPage]
      properties:
        page: { type: integer, minimum: 1, example: 1 }
        limit: { type: integer, minimum: 1, example: 20 }
        totalItems: { type: integer, minimum: 0, example: 42 }
        totalPages: { type: integer, minimum: 0, example: 3 }
        hasNextPage: { type: boolean, example: true }
        hasPreviousPage: { type: boolean, example: false }

    ErrorDetail:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: Mã ổn định để client xử lý.
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          description: Thông báo an toàn cho người dùng hoặc developer.
          example: The requested resource was not found.
        requestId:
          type: string
          description: ID tương quan để tra log; không chứa dữ liệu nhạy cảm.
          example: req_01JABCDEF
    FieldViolation:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: email }
        code: { type: string, example: INVALID_FORMAT }
        message: { type: string, example: Email must be valid. }
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ValidationErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          allOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: object
              required: [details]
              properties:
                details:
                  type: array
                  items:
                    $ref: '#/components/schemas/FieldViolation'

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 254, example: learner@example.com }
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Phải thỏa chính sách mật khẩu phía server; không được ghi log.
          example: Learner@123
        displayName: { type: string, minLength: 2, maxLength: 100, example: Nguyễn Văn Nam }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254, example: learner@example.com }
        password: { type: string, format: password, minLength: 1, maxLength: 72, example: Learner@123 }
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 20
          description: Refresh token bí mật; không lưu trong log.
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password, minLength: 1, maxLength: 72 }
        newPassword: { type: string, format: password, minLength: 8, maxLength: 72 }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string, description: JWT truy cập ngắn hạn. }
        refreshToken: { type: string, description: Token dùng để cấp lại access token. }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, minimum: 1, description: 'Thời gian sống access token, đơn vị giây.', example: 900 }
    AuthPayload:
      type: object
      required: [tokens, user]
      properties:
        tokens: { $ref: '#/components/schemas/TokenPair' }
        user: { $ref: '#/components/schemas/User' }
    AuthResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/AuthPayload' }
    TokenPairResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/TokenPair' }

    User:
      type: object
      required: [id, email, displayName, role, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, minLength: 2, maxLength: 100 }
        avatarUrl: { type: string, format: uri, nullable: true, maxLength: 2048 }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, displayName, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, minLength: 2, maxLength: 100 }
        role: { $ref: '#/components/schemas/UserRole' }
        temporaryPassword: { type: string, format: password, minLength: 8, maxLength: 72, nullable: true }
        sendInvitation: { type: boolean, default: true }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 2, maxLength: 100 }
        avatarUrl: { type: string, format: uri, nullable: true, maxLength: 2048 }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
    UserResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/User' }
    UserListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/User' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    LearnerProfile:
      type: object
      required: [id, user, level, domains, careerGoals, certificateGoals, onboardingCompleted, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        user: { $ref: '#/components/schemas/User' }
        level: { $ref: '#/components/schemas/Level' }
        domains: { type: array, items: { $ref: '#/components/schemas/Domain' } }
        careerGoals: { type: array, items: { $ref: '#/components/schemas/CareerGoal' } }
        certificateGoals: { type: array, items: { $ref: '#/components/schemas/CertificateGoal' } }
        bio: { type: string, nullable: true, maxLength: 500 }
        weeklyStudyTargetMinutes: { type: integer, minimum: 0, maximum: 10080, example: 180 }
        onboardingCompleted: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpsertLearnerProfileRequest:
      type: object
      additionalProperties: false
      required: [levelId, domainIds, careerGoalIds, certificateGoals]
      properties:
        levelId: { type: string, format: uuid }
        domainIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        careerGoalIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        certificateGoals:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CertificateGoalInput'
        bio: { type: string, nullable: true, maxLength: 500 }
        weeklyStudyTargetMinutes: { type: integer, minimum: 0, maximum: 10080, default: 180 }
    CertificateGoalInput:
      type: object
      additionalProperties: false
      required: [certificateId]
      properties:
        certificateId: { type: string, format: uuid }
        targetDate: { type: string, format: date, nullable: true }
    CertificateGoal:
      type: object
      required: [certificate, progressPercent]
      properties:
        certificate: { $ref: '#/components/schemas/Certificate' }
        targetDate: { type: string, format: date, nullable: true }
        progressPercent: { type: number, format: float, minimum: 0, maximum: 100, readOnly: true }
    LearnerProfileResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/LearnerProfile' }
    LearnerProfileListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/LearnerProfile' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    LearnerGroup:
      type: object
      required: [id, name, domain, certificate, teacher, status, members, memberCount, progressPercent, averageScorePercent, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 3, maxLength: 150, example: 'AWS Solutions Architect Fast-Track #01' }
        description: { type: string, nullable: true, maxLength: 1000 }
        domain: { $ref: '#/components/schemas/Domain' }
        certificate: { $ref: '#/components/schemas/Certificate' }
        teacher: { $ref: '#/components/schemas/User' }
        status: { $ref: '#/components/schemas/LearnerGroupStatus' }
        members: { type: array, items: { $ref: '#/components/schemas/User' } }
        memberCount: { type: integer, minimum: 0, readOnly: true }
        progressPercent: { type: number, format: float, minimum: 0, maximum: 100, readOnly: true }
        averageScorePercent: { type: number, format: float, minimum: 0, maximum: 100, nullable: true, readOnly: true }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LearnerGroupWriteRequest:
      type: object
      additionalProperties: false
      required: [name, domainId, certificateId, teacherId, status]
      properties:
        name: { type: string, minLength: 3, maxLength: 150 }
        description: { type: string, nullable: true, maxLength: 1000 }
        domainId: { type: string, format: uuid }
        certificateId: { type: string, format: uuid }
        teacherId: { type: string, format: uuid, description: Tài khoản phải có vai trò teacher. }
        status: { $ref: '#/components/schemas/LearnerGroupStatus' }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
    ReplaceGroupMembersRequest:
      type: object
      additionalProperties: false
      required: [learnerIds]
      properties:
        learnerIds:
          type: array
          uniqueItems: true
          maxItems: 500
          items: { type: string, format: uuid }
    LearnerGroupResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/LearnerGroup' }
    LearnerGroupListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/LearnerGroup' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Domain:
      type: object
      required: [id, code, name, description, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9_]{2,30}$', example: CLOUD }
        name: { type: string, minLength: 2, maxLength: 100, example: Cloud Computing }
        description: { type: string, maxLength: 500 }
        icon: { type: string, nullable: true, maxLength: 100, example: cloud }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DomainWriteRequest:
      type: object
      additionalProperties: false
      required: [code, name, description]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{2,30}$', example: DEVOPS }
        name: { type: string, minLength: 2, maxLength: 100, example: DevOps }
        description: { type: string, minLength: 1, maxLength: 500 }
        icon: { type: string, nullable: true, maxLength: 100 }
        isActive: { type: boolean, default: true }
    DomainResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/Domain' }
    DomainListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/Domain' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Level:
      type: object
      required: [id, code, name, order, description, isActive]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, enum: [beginner, intermediate, advanced, professional] }
        name: { type: string, minLength: 2, maxLength: 50 }
        order: { type: integer, minimum: 1, maximum: 100 }
        description: { type: string, maxLength: 500 }
        isActive: { type: boolean }
    LevelWriteRequest:
      type: object
      additionalProperties: false
      required: [code, name, order, description]
      properties:
        code: { type: string, enum: [beginner, intermediate, advanced, professional] }
        name: { type: string, minLength: 2, maxLength: 50 }
        order: { type: integer, minimum: 1, maximum: 100 }
        description: { type: string, minLength: 1, maxLength: 500 }
        isActive: { type: boolean, default: true }
    LevelResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/Level' }
    LevelListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/Level' } }

    CareerGoal:
      type: object
      required: [id, code, name, description, isActive]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9_]{2,40}$', example: BACKEND_ENGINEER }
        name: { type: string, minLength: 2, maxLength: 100, example: Backend Engineer }
        description: { type: string, maxLength: 500 }
        isActive: { type: boolean }
    CareerGoalWriteRequest:
      type: object
      additionalProperties: false
      required: [code, name, description]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{2,40}$' }
        name: { type: string, minLength: 2, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 500 }
        isActive: { type: boolean, default: true }
    CareerGoalResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/CareerGoal' }
    CareerGoalListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/CareerGoal' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Certificate:
      type: object
      required: [id, code, name, provider, description, domainIds, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9_-]{2,40}$', example: AWS-SAA }
        name: { type: string, minLength: 2, maxLength: 150, example: AWS Certified Solutions Architect – Associate }
        provider: { type: string, minLength: 2, maxLength: 100, example: Amazon Web Services }
        description: { type: string, maxLength: 1000 }
        examUrl: { type: string, format: uri, nullable: true, maxLength: 2048 }
        domainIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CertificateWriteRequest:
      type: object
      additionalProperties: false
      required: [code, name, provider, description, domainIds]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_-]{2,40}$' }
        name: { type: string, minLength: 2, maxLength: 150 }
        provider: { type: string, minLength: 2, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 1000 }
        examUrl: { type: string, format: uri, nullable: true, maxLength: 2048 }
        domainIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string, format: uuid } }
        isActive: { type: boolean, default: true }
    CertificateResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/Certificate' }
    CertificateListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/Certificate' } }
