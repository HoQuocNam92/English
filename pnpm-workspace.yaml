packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  multer: 2.3.0
  qs: 6.16.0

# pnpm 11: allowBuilds thay thế onlyBuiltDependencies
# Phê duyệt build scripts cho các package cần biên dịch native addons hoặc generate code
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  'bcrypt': true
  'prisma': true
  'esbuild': true
  'sharp': true
  '@scarf/scarf': true
  '@firebase/util': true
  protobufjs: true
nodeLinker: hoisted
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.16'
  - babel-preset-expo@58.0.21
  - expo-auth-session@58.0.15
  - expo-dev-client@58.0.16
  - expo-dev-launcher@58.0.16
  - expo-modules-core@58.0.27
  - expo-router@58.0.27
  - expo@58.0.20
