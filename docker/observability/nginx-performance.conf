# Request paths are grouped into resource families; query strings, headers and bodies are not logged.
map $uri $techenglish_endpoint {
    default /other;
    ~^/api/v1/(?<te_resource>[A-Za-z_-]+) /api/v1/$te_resource;
    ~^/api/docs /api/docs;
    ~^/monitoring/ /monitoring;
    ~^/_next/ /static;
    ~^/login$ /login;
}
log_format techenglish_performance escape=json '{"time":"$time_iso8601","service":"$host","method":"$request_method","endpoint":"$techenglish_endpoint","status":$status,"duration":$request_time,"upstream_duration":"$upstream_response_time","bytes":$body_bytes_sent}';
