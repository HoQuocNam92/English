global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: production
    application: techenglish
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: [localhost:9090]}]
  - job_name: node
    static_configs: [{targets: [node-exporter:9100]}]
  - job_name: alertmanager
    static_configs: [{targets: [alertmanager:9093]}]
  - job_name: loki
    static_configs: [{targets: [loki:3100]}]
  - job_name: alloy
    static_configs: [{targets: [alloy:12345]}]
  - job_name: http
    metrics_path: /probe
    params: {module: [https_2xx]}
    static_configs:
      - targets: [https://techenglish.click/login, https://api.techenglish.click/api/docs-json, https://techenglish.click/monitoring/api/health]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: 'blackbox:9115'}
