name: Mobile EAS build
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        type: choice
        options: [preview, production]
        default: preview
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    environment: mobile
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build installable app
        working-directory: apps/mobile
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_OWNER: ${{ vars.EXPO_OWNER }}
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
        run: |
          test -n "$EAS_PROJECT_ID" || { echo "Configure EAS_PROJECT_ID in mobile environment"; exit 1; }
          eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive
