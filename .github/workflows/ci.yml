name: CI and container delivery
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      EXPO_PUBLIC_API_URL: http://localhost:8080/api/v1
      DATABASE_URL: postgresql://techenglish:ci-password@localhost:5432/techenglish
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: techenglish
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: techenglish
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U techenglish -d techenglish"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @techenglish/api db:generate
      - run: pnpm --filter @techenglish/api db:migrate:deploy
      - run: pnpm typecheck
      - run: pnpm --filter web typecheck
      - run: pnpm --filter mobile typecheck
      - run: pnpm --filter @techenglish/api test
      - run: pnpm --filter @techenglish/shared-kernel test
      - run: pnpm --filter @techenglish/api build
      - run: pnpm --filter web build
      - run: pnpm --filter mobile exec expo export --platform android --output-dir dist-ci
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-js-bundle
          path: apps/mobile/dist-ci
          retention-days: 7
      - name: Validate Compose
        run: docker compose --env-file .env.compose.example config --quiet

  images:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8080/api/v1' }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
