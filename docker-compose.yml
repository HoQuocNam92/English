services:
  redis:
    image: redis:7-alpine
    container_name: techenglish-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:${REDIS_CONTAINER_PORT}"
    volumes:
      - redis_data:/data
    command: redis-server --port ${REDIS_CONTAINER_PORT} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${REDIS_CONTAINER_PORT} ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: techenglish-redis-ui
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:${REDIS_CONTAINER_PORT}
      - PORT=${REDIS_COMMANDER_PORT}
    ports:
      - "${REDIS_COMMANDER_PORT}:${REDIS_COMMANDER_PORT}"
    depends_on:
      - redis

volumes:
  redis_data:
    driver: local
